<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img" aria-labelledby="title desc">
<title id="title">Chest and cockpit packaging, neutral robot coordinates</title>
<desc id="desc">Dimensioned front and side reference sections show a seated cockpit above a rear-inserted core, a lower portal in the rear structural spine, waist interface, rear crossmember, settled shoulder roots, projecting neck pilot and lifting points. A lower diagram shows the upright source pose and capsule insertion inside the selected eleven by twelve metre bulky-module bay. These are bounding design sections, not solid or strength validation.</desc>

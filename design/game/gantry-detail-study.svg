<title id="title">Gantry column and foundation detail study</title>
<desc id="desc">Proposed visual treatment of the existing final assembly gantry. A lower column axonometric, dimensioned foundation plan and numbered material details. Design drawing only, not a game render. Existing collision and working clearances are retained.</desc>
